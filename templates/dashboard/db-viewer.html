<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrickWorks Admin - Database Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  color: #e5e5e5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
}

/* Sidebar */
.sidebar {
  width: 280px;
  background: #141414;
  border-right: 1px solid #2a2a2a;
  padding: 2rem 0;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  padding: 0 1.5rem 2rem;
  font-size: 1.25rem;
  font-weight: 600;
  color: #fff;
}

.nav-menu {
  list-style: none;
}

.nav-item {
  margin-bottom: 0.25rem;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.875rem 1.5rem;
  color: #888;
  text-decoration: none;
  transition: all 0.2s ease;
  font-size: 0.95rem;
}

.nav-link:hover {
  background: #1a1a1a;
  color: #fff;
}

.nav-link.active {
  background: #2a2a2a;
  color: #fff;
  border-right: 3px solid #fff;
}

.nav-link i {
  font-size: 1.1rem;
  width: 20px;
}

/* Main Content */
.main-content {
  flex: 1;
  margin-left: 280px;
  min-height: 100vh;
}

.content-header {
  padding: 2rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #2a2a2a;
}

.content-header h1 {
  font-size: 2rem;
  font-weight: 600;
  color: #fff;
}

.header-actions {
  display: flex;
  gap: 1rem;
}

.btn {
  padding: 0.75rem 1.5rem;
  background: #fff;
  border: none;
  border-radius: 8px;
  color: #000;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
}

.btn-secondary {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #3a3a3a;
}

.btn-secondary:hover {
  background: #333;
  box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
}

/* Content Body */
.content-body {
  padding: 2rem 3rem;
}

.search-controls {
  display: flex;
  margin-bottom: 1.5rem;
  align-items: space-between;
  flex-direction: row;
  justify-content: space-between;
}

.search-box {
  min-width: 400px;
  max-width: 100%;
  width: 100%;
  padding: 0.875rem 1rem;
  padding-left: 2.75rem;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  color: #e5e5e5;
  font-size: 0.95rem;
  position: relative;
}

.search-wrapper {
  position: relative;
  flex: 1;
}

.search-wrapper i {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: #666;
}

.search-box:focus {
  outline: none;
  border-color: #444;
  background: #222;
}

.download-btn {
  padding: 0.75rem;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  color: #888;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
}

.download-btn:hover {
  background: #222;
  color: #fff;
}

/* Table */
.table-container {
  background: #141414;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
}

th {
  padding: 1rem 1.5rem;
  text-align: left;
  font-weight: 500;
  color: #888;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

td {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid #1a1a1a;
  color: #e5e5e5;
  font-size: 0.95rem;
}

tbody tr {
  transition: background 0.2s ease;
}

tbody tr:hover {
  background: #1a1a1a;
}

tbody tr:last-child td {
  border-bottom: none;
}

.color-cell {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.color-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid #2a2a2a;
  flex-shrink: 0;
}

.actions {
  display: flex;
  gap: 0.5rem;
}

.icon-btn {
  padding: 0.5rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  color: #6b7cff;
  cursor: pointer;
  transition: all 0.3s ease;
}

.icon-btn:hover {
  background: rgba(107, 124, 255, 0.2);
  transform: scale(1.1);
}

.icon-btn.delete {
  color: #ff3366;
}

.icon-btn.delete:hover {
  background: rgba(255, 51, 102, 0.2);
}

/* Pagination */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  margin-top: 2rem;
}

.page-info {
  color: #888;
  font-size: 0.95rem;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.modal.active {
  display: flex;
}

.modal-content {
  background: #1a1a1a;
  padding: 2rem;
  border-radius: 16px;
  border: 1px solid #2a2a2a;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid #2a2a2a;
}

.modal-header h2 {
  color: #fff;
  font-size: 1.5rem;
}

.close-btn {
  background: none;
  border: none;
  color: #888;
  font-size: 1.5rem;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: all 0.2s ease;
}

.close-btn:hover {
  background: #2a2a2a;
  color: #fff;
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: #888;
  font-size: 0.9rem;
  font-weight: 500;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 0.875rem 1rem;
  background: #0a0a0a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  color: #e5e5e5;
  font-size: 0.95rem;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: #444;
  background: #111;
}

.color-preview {
  width: 100%;
  height: 60px;
  border-radius: 8px;
  border: 2px solid #2a2a2a;
  margin-top: 0.5rem;
}

/* Toast */
.toast {
  position: fixed;
  top: 2rem;
  right: 2rem;
  padding: 1rem 1.5rem;
  background: #fff;
  color: #000;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
  font-weight: 500;
  z-index: 2000;
  animation: slideIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.toast.error {
  background: #ff3366;
  color: #fff;
}

.toast.success {
  background: #00d084;
  color: #fff;
}

@keyframes slideIn {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.loading {
  text-align: center;
  padding: 3rem;
  color: #666;
}

.empty-state {
  text-align: center;
  padding: 3rem;
  color: #666;
}

.empty-state i {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.5;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: #0a0a0a;
}

::-webkit-scrollbar-thumb {
  background: #2a2a2a;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #3a3a3a;
}
</style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">BrickWorks Admin</div>
    <nav>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="/dashboard/" class="nav-link">
            <i class="fas fa-th-large"></i>
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="fas fa-upload"></i>
            Upload XML
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link active" data-table="category">
            <i class="fas fa-folder"></i>
            Category
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-table="color">
            <i class="fas fa-palette"></i>
            Colors
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-table="parts">
            <i class="fas fa-cube"></i>
            Parts
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-table="minifigures">
            <i class="fas fa-user"></i>
            Minifigures
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-table="gears">
            <i class="fas fa-cog"></i>
            Gears
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-table="parts_with_colors">
            <i class="fas fa-cubes"></i>
            Parts With Colors
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-table="users">
            <i class="fas fa-users"></i>
            Users
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="content-header">
      <h1 id="pageTitle">Categories</h1>
      <div class="header-actions">
        <button class="btn" onclick="openAddModal()">
          <i class="fas fa-plus"></i>
          Add New Category
        </button>
      </div>
    </header>

    <div class="content-body">
      <div class="search-controls">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" class="search-box" id="searchBox" placeholder="Search categories" onkeyup="filterTable()">
        </div>
      </div>

      <div class="search-controls">
        <button class="download-btn" onclick="downloadXML()" title="Download as XML">
          <i class="fas fa-download"></i>
        </button>
        <button class="btn-secondary btn" onclick="exportData()">
          <i class="fas fa-file-export"></i>
          Export
        </button>
        <button class="btn-secondary btn" onclick="loadTable()">
          <i class="fas fa-sync"></i>
          Refresh
        </button>
      </div>

      <div class="table-container">
        <div id="tableWrapper">
          <div class="loading">
            <i class="fas fa-spinner fa-spin"></i> Loading...
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination" style="display: none;">
        <button class="btn-secondary btn" onclick="previousPage()">
          <i class="fas fa-chevron-left"></i>
          Previous
        </button>
        <span class="page-info" id="pageInfo">Page 1 of 1</span>
        <button class="btn-secondary btn" onclick="nextPage()">
          Next
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Row</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="editForm"></div>
      <button class="btn" onclick="saveEdit()" style="width: 100%; margin-top: 1rem;">
        <i class="fas fa-save"></i>
        Save Changes
      </button>
    </div>
  </div>

  <!-- Add Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="addModalTitle">Add New Category</h2>
        <button class="close-btn" onclick="closeAddModal()">&times;</button>
      </div>
      <div id="addForm"></div>
      <button class="btn" onclick="saveNew()" style="width: 100%; margin-top: 1rem;">
        <i class="fas fa-plus"></i>
        Add Row
      </button>
    </div>
  </div>

  <script>
    let currentTable = 'category';
    let currentData = [];
    let currentColumns = [];
    let editingRow = null;
    let currentPrimaryKey = 'id';
    let currentPage = 1;
    let rowsPerPage = 20;
    let filteredData = [];

    // Get CSRF token from Django cookie
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === name + "=") {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    const csrftoken = getCookie("csrftoken");
    axios.defaults.headers.common["X-CSRFToken"] = csrftoken;

    // Table display configurations
    const tableConfig = {
      category: {
        title: 'Categories',
        addButton: 'Add New Category',
        searchPlaceholder: 'Search categories',
        exportName: 'category',
        grouping: 'CATALOG',
      },
      color: {
        title: 'Colors',
        addButton: 'Add New Color',
        searchPlaceholder: 'Search colors',
        exportName: 'color',
        grouping: 'CATALOG',
      },
      parts: {
        title: 'Parts',
        addButton: 'Add New Part',
        searchPlaceholder: 'Search parts',
        exportName: 'parts',
        grouping: 'CATALOG',
      },
      parts_with_colors: {
        title: 'Parts With Colors',
        addButton: 'Add New Part Color',
        searchPlaceholder: 'Search parts and colors',
        exportName: 'parts_colors',
        grouping: 'CATALOG',
      },
      minifigures: {
        title: 'Minifigures',
        addButton: 'Add New Minifigure',
        searchPlaceholder: 'Search minifigures',
        exportName: 'minifigures',
        grouping: 'CATALOG',
      },
      gears: {
        title: 'Gears',
        addButton: 'Add New Gear',
        searchPlaceholder: 'Search gears',
        exportName: 'gears',
        grouping: 'CATALOG',
      },
      sets: {
        title: 'Sets',
        addButton: 'Add New Set',
        searchPlaceholder: 'Search sets',
        exportName: 'sets',
        grouping: 'CATALOG',
      },
      inventory: {
        title: 'Inventory',
        addButton: 'Add Inventory Item',
        searchPlaceholder: 'Search inventory',
        exportName: 'inventory',
        grouping: 'CATALOG',
      },
      users: {
        title: 'Users',
        addButton: 'Add New User',
        searchPlaceholder: 'Search users',
        exportName: 'users'
      }
    };

    // Helper function to format column names
    function formatColumnName(colName) {
      return colName
        .split('_')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }

    // Helper function to check if a column contains color data
    function isColorColumn(colName) {
      return colName.toLowerCase().includes('rgb') || 
             colName.toLowerCase().includes('color') && 
             colName.toLowerCase().includes('code');
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function updateUI(table) {
      const config = tableConfig[table] || tableConfig.category;
      document.getElementById('pageTitle').textContent = config.title;
      document.querySelector('.header-actions .btn').innerHTML = `<i class="fas fa-plus"></i> ${config.addButton}`;
      document.getElementById('searchBox').placeholder = config.searchPlaceholder;
      document.getElementById('addModalTitle').textContent = config.addButton;
    }

    // Navigation handling
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', function(e) {
        const table = this.getAttribute('data-table');
        if (table) {
          e.preventDefault();
          document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
          this.classList.add('active');
          currentTable = table;
          currentPage = 1;
          updateUI(table);
          loadTable();
        }
      });
    });

    async function loadTable() {
      const wrapper = document.getElementById('tableWrapper');
      wrapper.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';

      try {
        const response = await axios.get(`/api/db/table/${currentTable}/`);
        
        currentData = response.data.rows || [];
        currentColumns = response.data.columns || [];
        currentPrimaryKey = response.data.primary_key || 'id';
        filteredData = currentData;
        currentPage = 1;

        if (currentData.length === 0) {
          wrapper.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No data in this table</p></div>';
          document.getElementById('pagination').style.display = 'none';
          return;
        }

        renderTable();
        showToast(`Loaded ${currentData.length} rows`);

      } catch (error) {
        console.error('Error loading table:', error);
        wrapper.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading table data</p></div>';
        showToast('Failed to load table data', 'error');
        document.getElementById('pagination').style.display = 'none';
      }
    }

    function renderTable(data = filteredData) {
      const wrapper = document.getElementById('tableWrapper');
      
      if (!data || data.length === 0) {
        wrapper.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No data available</p></div>';
        document.getElementById('pagination').style.display = 'none';
        return;
      }

      // Pagination calculations
      const totalPages = Math.ceil(data.length / rowsPerPage);
      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = data.slice(start, end);

      // Build table header
      let html = '<table><thead><tr>';
      
      currentColumns.forEach(col => {
        html += `<th>${formatColumnName(col)}</th>`;
      });
      html += '<th>Actions</th>';
      html += '</tr></thead><tbody>';

      // Build table rows
      pageData.forEach((row, idx) => {
        const actualIndex = start + idx;
        html += '<tr>';
        
        currentColumns.forEach(col => {
          const value = row[col];
          
          // Special rendering for color columns
          if (isColorColumn(col) && value && value.startsWith('#')) {
            html += `
              <td>
                <div class="color-cell">
                  <div class="color-dot" style="background-color: ${value}"></div>
                  <span>${value}</span>
                </div>
              </td>
            `;
          } else if (col.toLowerCase() === 'rgb' && value && value.startsWith('#')) {
            html += `
              <td>
                <div class="color-cell">
                  <div class="color-dot" style="background-color: ${value}"></div>
                  <span>${value}</span>
                </div>
              </td>
            `;
          } else {
            const displayValue = value !== null && value !== undefined ? value : '';
            html += `<td>${displayValue}</td>`;
          }
        });
       
        html += `
          <td class="actions">
            <button class="icon-btn" onclick="editRow(${actualIndex})" title="Edit">
              <i class="fas fa-edit"></i>
            </button>
            <button class="icon-btn delete" onclick="deleteRow(${actualIndex})" title="Delete">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        `;
        html += '</tr>';
      });

      html += '</tbody></table>';
      wrapper.innerHTML = html;

      // Update pagination
      document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
    }

    function nextPage() {
      const totalPages = Math.ceil(filteredData.length / rowsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
      }
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    }

    function editRow(rowIndex) {
      editingRow = rowIndex;
      const row = filteredData[rowIndex];
      const modal = document.getElementById('editModal');
      const form = document.getElementById('editForm');
      
      let html = '';
      Object.keys(row).forEach(key => {
        if (key === 'rgb' || key === 'color_code') {
          html += `
            <div class="form-group">
              <label>${key.toUpperCase()}</label>
              <input type="color" id="edit_${key}_picker" value="${row[key] || '#000000'}" 
                     onchange="document.getElementById('edit_${key}').value = this.value">
              <input type="text" id="edit_${key}" value="${row[key] || ''}" 
                     oninput="document.getElementById('edit_${key}_picker').value = this.value"
                     style="margin-top: 0.5rem">
              <div class="color-preview" id="edit_${key}_preview" style="background-color: ${row[key] || '#000'}"></div>
            </div>
          `;
        } else {
          html += `
            <div class="form-group">
              <label>${key}</label>
              <input type="text" id="edit_${key}" value="${row[key] || ''}" ${key === currentPrimaryKey ? 'readonly' : ''}>
            </div>
          `;
        }
      });
      
      form.innerHTML = html;
      modal.classList.add('active');
    }

    async function saveEdit() {
      const row = filteredData[editingRow];
      const updatedRow = {};
      
      Object.keys(row).forEach(key => {
        const input = document.getElementById(`edit_${key}`);
        if (input) updatedRow[key] = input.value;
      });

      try {
        await axios.put(`/api/db/table/${currentTable}/row/${row[currentPrimaryKey]}/`, updatedRow);
        
        filteredData[editingRow] = updatedRow;
        const originalIndex = currentData.findIndex(r => r[currentPrimaryKey] === row[currentPrimaryKey]);
        if (originalIndex !== -1) {
          currentData[originalIndex] = updatedRow;
        }
        
        closeModal();
        renderTable();
        showToast('Row updated successfully');
      } catch (error) {
        console.error('Error updating row:', error);
        showToast('Failed to update row', 'error');
      }
    }

    async function deleteRow(rowIndex) {
      if (!confirm('Are you sure you want to delete this row?')) return;

      const row = filteredData[rowIndex];
      
      try {
        await axios.delete(`/api/db/table/delete/${currentTable}/row/${row[currentPrimaryKey]}/`);
        
        // Remove from both arrays
        filteredData.splice(rowIndex, 1);
        const originalIndex = currentData.findIndex(r => r[currentPrimaryKey] === row[currentPrimaryKey]);
        if (originalIndex !== -1) {
          currentData.splice(originalIndex, 1);
        }
        
        // Adjust current page if needed
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        if (currentPage > totalPages && totalPages > 0) {
          currentPage = totalPages;
        }
        
        renderTable();
        showToast('Row deleted successfully');
      } catch (error) {
        console.error('Error deleting row:', error);
        showToast('Failed to delete row', 'error');
      }
    }

    function openAddModal() {
      const modal = document.getElementById('addModal');
      const form = document.getElementById('addForm');
      
      if (!currentColumns || currentColumns.length === 0) {
        showToast('Please load a table first', 'error');
        return;
      }

      let html = '';
      currentColumns.forEach(col => {
        // Skip auto-increment ID fields
        if (col.toLowerCase() === 'id' && currentPrimaryKey.toLowerCase() === 'id') {
          return;
        }

        // Check if it's a color field
        if (isColorColumn(col) || col.toLowerCase() === 'rgb') {
          html += `
            <div class="form-group">
              <label>${formatColumnName(col)}</label>
              <input type="color" id="add_${col}_picker" value="#000000" 
                     onchange="document.getElementById('add_${col}').value = this.value; document.getElementById('add_${col}_preview').style.backgroundColor = this.value">
              <input type="text" id="add_${col}" placeholder="Enter ${col}" value="#000000"
                     oninput="document.getElementById('add_${col}_picker').value = this.value; document.getElementById('add_${col}_preview').style.backgroundColor = this.value"
                     style="margin-top: 0.5rem">
              <div class="color-preview" id="add_${col}_preview" style="background-color: #000000"></div>
            </div>
          `;
        } else {
          html += `
            <div class="form-group">
              <label>${formatColumnName(col)}</label>
              <input type="text" id="add_${col}" placeholder="Enter ${col}">
            </div>
          `;
        }
      });
      
      form.innerHTML = html;
      modal.classList.add('active');
    }

    async function saveNew() {
      const newRow = {};
      
      // Get all inputs from the form
      currentColumns.forEach(col => {
        // Skip auto-increment ID fields
        if (col.toLowerCase() === 'id' && currentPrimaryKey.toLowerCase() === 'id') {
          return;
        }
        
        const input = document.getElementById(`add_${col}`);
        if (input) {
          newRow[col] = input.value;
        }
      });

      console.log('Sending new row data:', newRow);

      try {
        const response = await axios.post(`/api/db/table/add/${currentTable}/`, newRow);
        console.log('Add response:', response.data);
        
        closeAddModal();
        loadTable();
        showToast('Row added successfully');
      } catch (error) {
        console.error('Error adding row:', error);
        console.error('Error response:', error.response?.data);
        showToast(error.response?.data?.error || 'Failed to add row', 'error');
      }
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
    }

    function filterTable() {
      const searchTerm = document.getElementById('searchBox').value.toLowerCase();
      
      if (!searchTerm) {
        filteredData = currentData;
        currentPage = 1;
        renderTable();
        return;
      }

      filteredData = currentData.filter(row => {
        return Object.values(row).some(val => 
          String(val).toLowerCase().includes(searchTerm)
        );
      });

      currentPage = 1;
      renderTable();
    }

    function downloadXML() {
      if (!currentData || currentData.length === 0) {
        showToast('No data to download', 'error');
        return;
      }

      const config = tableConfig[currentTable] || tableConfig.category;
      showToast(`Preparing XML download...`);

      // Generate XML from current table data
      let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += `<${config.grouping}>\n`;

      currentData.forEach(row => {
        xml += `  <ITEM>\n`;
        currentColumns.forEach(col => {
          const value = row[col] !== null && row[col] !== undefined ? row[col] : '';
          // Escape XML special characters
          const escapedValue = String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
          xml += `    <${col.toUpperCase().replace(/_/g, '')}>${escapedValue}</${col.toUpperCase().replace(/_/g, '')}>\n`;
        });
        xml += `  </ITEM>\n`;
      });

      xml += `</${config.grouping}>`;

      // Create blob and download
      const blob = new Blob([xml], { type: 'application/xml' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentTable}_${new Date().toISOString().split('T')[0]}.xml`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);

      showToast(`✓ Downloaded ${currentTable}.xml successfully`);
    }

    function exportData() {
      const config = tableConfig[currentTable] || tableConfig.category;
      showToast(`Exporting ${config.exportName}...`);

      axios.post(`/dashboard/export/${config.exportName}/`)
        .then(res => {
          showToast(`✓ Exported ${config.exportName.toUpperCase()} successfully.`);
          console.log('Export data:', res.data.status);
        })
        .catch(err => {
          console.error('Error exporting:', err);
          showToast(`✗ Failed to export ${config.exportName}`, 'error');
        });
    }

    // Load initial table
    loadTable();
  </script>
</body>
</html>
